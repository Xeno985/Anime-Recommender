<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Anime Recommender System</h1>
        {% if current_user.is_authenticated %}
            <p>Welcome, User {{ current_user.id }}! <a href="{{ url_for('logout') }}">Logout</a></p>
        {% else %}
            <form action="{{ url_for('login') }}" method="POST" class="mb-4">
                <div class="mb-3">
                    <label for="user_id" class="form-label">User ID</label>
                    <input type="number" class="form-control" id="user_id" name="user_id" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        {% endif %}
        <form action="{{ url_for('recommend') }}" method="POST" class="mb-4">
            <div class="mb-3">
                <label for="anime_id" class="form-label">Anime ID</label>
                <input type="number" class="form-control" id="anime_id" name="anime_id" required>
            </div>
            <button type="submit" class="btn btn-primary">Get Recommendations</button>
        </form>
        <h2 class="mb-3">Search Anime</h2>
        <input type="text" class="form-control mb-3" id="searchQuery" placeholder="Search for anime...">
        <div id="searchResults" class="row"></div>
    </div>
    <script>
        document.getElementById('searchQuery').addEventListener('input', function() {
            const query = this.value;
            if (query.length > 2) {
                fetch(`/search?query=${query}`)
                    .then(response => response.json())
                    .then(data => {
                        const results = document.getElementById('searchResults');
                        results.innerHTML = '';
                        data.forEach(anime => {
                            results.innerHTML += `
                                <div class="col-md-4">
                                    <div class="card">
                                        <img src="${anime.image_url}" class="card-img-top" alt="${anime.name}">
                                        <div class="card-body">
                                            <h5 class="card-title">${anime.name}</h5>
                                            <p class="card-text">${anime.genre}</p>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                    });
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
